<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<nav>
    <a href="#" class="menu-link" data-page="home">Home</a> | 
    <a href="#" class="menu-link" data-page="blog">Blog</a> | 
    <a href="#" class="menu-link" data-page="products">Products</a>
</nav>

<hr>
<div id="main-content"><h3>Home</h3><p>Welcome to the dashboard homepage.</p></div>

<script>
$(document).ready(function() {
    $(".menu-link").click(function(e) {
        e.preventDefault(); // Stop page jumping
        var pageName = $(this).attr("data-page");

        // Fetch and load structural data context dynamically
        $.get("content.php", { page: pageName }, function(data) {
            $("#main-content").html(data);
        });
    });
});
</script>

</body>
</html>
