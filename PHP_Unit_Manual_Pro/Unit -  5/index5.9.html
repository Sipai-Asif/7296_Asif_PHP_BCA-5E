<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<input type="text" id="search" placeholder="Search fruit...">
<div id="suggestion-box" style="border: 1px solid #ccc; width: 170px; display:none;"></div>

<script>
$(document).ready(function() {
    $("#search").keyup(function() {
        var query = $(this).val();
        if (query != "") {
            $.ajax({
                url: "suggest.php",
                method: "GET",
                data: { q: query },
                success: function(data) {
                    $("#suggestion-box").fadeIn().html(data);
                }
            });
        } else {
            $("#suggestion-box").fadeOut();
        }
    });
});
</script>
